name: Build DJI Waypoint Injector APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/dji-waypoint-injector.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dji-waypoint-injector-apk
          path: android/app/build/outputs/apk/debug/dji-waypoint-injector.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: DJI Waypoint Injector v1.0.1
          body: |
            ### 📱 DJI Waypoint Injector v1.0.1 (Android Companion App)
            Aplikasi Android ringan untuk menimpa misi dummy di aplikasi DJI Fly secara otomatis.
            
            **Pembaruan v1.0.1:**
            - 🚀 **Auto Deep-Link URI:** Langsung melompat ke folder `Android/data/dji.go.v5/files/waypoint` saat meminta izin SAF (mengatasi masalah folder `Android/data` yang tersembunyi di Android 11-14).
            - 🕹️ **Mode Direct File:** Deteksi otomatis folder DJI Fly di remote control DJI RC 2 / DJI RC Pro tanpa perlu izin SAF.
            - 📥 **Simpan KMZ:** Tombol baru untuk mengunduh KMZ langsung ke folder Downloads publik.
            - 🔄 Sinkronisasi akun & misi tersimpan dari web `backend-iot.qbyte.web.id/maping`.
            - ⚡ Tombol sekali klik: Timpa & Buka DJI Fly.
          files: android/app/build/outputs/apk/debug/dji-waypoint-injector.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
